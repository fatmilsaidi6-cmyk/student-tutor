name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install tesseract (for OCR tests)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build production image
        run: docker build -t study-buddy:ci .

      - name: Smoke-test the image
        run: |
          docker run -d --name sb -p 8000:8000 -e SESSION_SECRET=ci-secret study-buddy:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/health; then ok=1; break; fi
            sleep 1
          done
          test "${ok:-0}" = "1"
          curl -fsS http://localhost:8000/ | grep -qi "<!doctype html>"
          docker logs sb
          docker rm -f sb
